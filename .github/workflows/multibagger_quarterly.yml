name: Multibagger · Quarterly

# 5th of Jan / Apr / Jul / Oct, 16:00 UTC. Thesis review + post-mortems.
on:
  schedule:
    - cron: "0 16 5 1,4,7,10 *"
  workflow_dispatch:

concurrency:
  group: multibagger-quarterly
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  review:
    name: "Quarterly thesis review"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline

      - name: Re-screen + reclassify each active watchlist name
        run: python -m pipeline.multibagger.quarterly_review

      - name: Archive any newly broken theses
        run: python -m pipeline.multibagger.watchlist_manager --archive

      - name: Generate quarterly thesis review report
        run: python -m pipeline.multibagger.reports --quarterly
