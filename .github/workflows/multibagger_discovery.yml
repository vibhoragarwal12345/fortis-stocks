name: Multibagger · Discovery (weekly)

# Emerging multibagger DISCOVERY engine: full screen + deep research + report.
# WEEKLY on MONDAYS 15:00 UTC (owner directive June 2026 -- moved from Saturday
# so the emerging refresh leads the trading week). Heavyweight -- ~30-60 min
# depending on universe size and Finnhub rate limits. NOTE: this is LLM-heavy
# (deep research) and Mondays also carry the stock scan (12:00 + 16:30 UTC) and
# the weekly commodity scan (22:45 UTC) -- 15:00 sits between the stock slots;
# watch the shared free-LLM daily budget on Mondays.
on:
  # Scheduled trigger: Supabase pg_cron fires a repository_dispatch Monday
  # 15:00 UTC (migration 054). GitHub's native `schedule:` cron was removed --
  # pg_cron is the single reliable source. repository_dispatch also lets us kick
  # off a cycle on demand; workflow_dispatch stays for manual runs.
  repository_dispatch:
    types: [run-multibagger-discovery]
  workflow_dispatch:
    inputs:
      sample:
        description: "Sample size (omit for full universe)"
        required: false
        default: ""
      top_n:
        description: "How many top candidates advance to deep research"
        required: false
        default: "30"

concurrency:
  group: multibagger-discovery
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

jobs:
  refresh-universe:
    name: "Stage 0 · Refresh universe"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline
      - run: python -m pipeline.multibagger.universe
      - uses: actions/upload-artifact@v4
        with:
          name: mb_universe
          path: pipeline/multibagger/data/mb_universe.csv
          retention-days: 7

  screen-and-score:
    name: "Stage 1+2 · Screen + Score"
    needs: refresh-universe
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline
      - uses: actions/download-artifact@v4
        with:
          name: mb_universe
          path: pipeline/multibagger/data
      - name: Structural screen
        run: |
          set -e
          if [ -n "${{ github.event.inputs.sample }}" ]; then
            python -m pipeline.multibagger.screener --sample ${{ github.event.inputs.sample }}
          else
            python -m pipeline.multibagger.screener
          fi
      - name: Score + advance top-N to research
        run: python -m pipeline.multibagger.scorer --top-n ${{ github.event.inputs.top_n || 30 }}

  deep-research:
    name: "Stage 3 · Deep research"
    needs: screen-and-score
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline
      - run: python -m pipeline.multibagger.deep_research --top-n ${{ github.event.inputs.top_n || 30 }}

  watchlist-and-report:
    name: "Stage 4 · Watchlist + weekly report"
    needs: deep-research
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline
      - name: Add qualifying candidates to watchlist
        run: python -m pipeline.multibagger.watchlist_manager --add
      - name: Refresh prices for the new entries
        run: python -m pipeline.multibagger.watchlist_manager --update
      - name: Generate Emerging Opportunities report
        run: python -m pipeline.multibagger.reports --weekly
