name: Commodity scan · daily tactical + weekly structural

# Commodities pipeline Part C. TWO cadences (owner directive, June 2026):
#   --mode tactical : DAILY pre-market (Mon-Fri), bundled with the stock pre-
#                     market slot. Refreshes the short-term read (price, the
#                     1-week band, news) and CARRIES FORWARD the weekly
#                     structural read -- no structural LLM call is spent.
#   --mode full     : WEEKLY on Mondays, regenerates everything incl. the
#                     long-horizon structural read.
# Tactical signals (price/technicals/news) move daily; structural fundamentals
# (EIA weekly, COT weekly, IMF/FRED monthly) do not -- so each refreshes at its
# own velocity. The doubled LLM budget covers the daily tactical pass.
#
# Required secrets beyond the stock scan's set: FRED_API_KEY, EIA_API_KEY,
# USDA_NASS_API_KEY (all free-tier keys, already in .env.local locally).

on:
  # Scheduled trigger: Supabase pg_cron fires repository_dispatch with a
  # client_payload.mode (migration 055): tactical daily ~12:05 UTC Mon-Fri,
  # full weekly Monday 22:45 UTC. GitHub's native `schedule:` cron stays
  # removed -- pg_cron is the single reliable source. workflow_dispatch is for
  # manual/partial runs.
  repository_dispatch:
    types: [run-commodity-scan]
  workflow_dispatch:
    inputs:
      mode:
        description: "Scan mode"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - tactical
      commodities:
        description: "Space-separated registry keys (blank = all)"
        required: false
        default: ""

concurrency:
  group: commodity-scan
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
  GROQ_API_KEY_2:            ${{ secrets.GROQ_API_KEY_2 }}
  GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
  CEREBRAS_API_KEY:          ${{ secrets.CEREBRAS_API_KEY }}
  CEREBRAS_API_KEY_2:        ${{ secrets.CEREBRAS_API_KEY_2 }}
  NVIDIA_API_KEY:            ${{ secrets.NVIDIA_API_KEY }}
  OPENROUTER_API_KEY:        ${{ secrets.OPENROUTER_API_KEY }}
  FRED_API_KEY:              ${{ secrets.FRED_API_KEY }}
  EIA_API_KEY:               ${{ secrets.EIA_API_KEY }}
  USDA_NASS_API_KEY:         ${{ secrets.USDA_NASS_API_KEY }}

jobs:
  scan:
    name: "Run commodity model (all layers)"
    runs-on: ubuntu-latest
    # The narrative layer (11 commodities x 2 horizons x up-to-3 attempts,
    # each gated by factcheck + critic) runs against rate-limited free LLM
    # providers; observed wall time is ~28 min, and the scan persists ONLY at
    # the end, so a kill loses the whole run. 50 min gives that single persist
    # comfortable headroom above the slowest observed run.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline

      - name: Derive scan mode
        id: mode
        run: |
          if [ -n "${{ github.event.client_payload.mode }}" ]; then
            echo "mode=${{ github.event.client_payload.mode }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            echo "mode=full" >> $GITHUB_OUTPUT
          fi

      - name: Run commodity scan
        run: |
          python -m pipeline.commodities.scan --mode ${{ steps.mode.outputs.mode }} ${{ github.event.inputs.commodities }}
