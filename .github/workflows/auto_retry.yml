name: Auto-retry transient failures

# WHY THIS EXISTS
# On 2026-08-17 the weekly Multibagger Discovery run died in "Stage 1+2" with
#   Failed to download action 'actions/download-artifact' ... 429 Too Many Requests
# after 3 internal attempts. Nothing was wrong with the code -- GitHub's own
# codeload endpoint rate-limited the action tarball download. Stage 0 had
# already succeeded, and Stages 3 and 4 were skipped via `needs:`, so one
# transient infrastructure blip cost the entire weekly discovery pipeline. The
# workflow is weekly, so the next scheduled attempt was 7 days later.
#
# This re-runs ONLY the failed jobs of a failed run, at most once. `--failed`
# keeps the jobs that already succeeded (Stage 0 above) instead of redoing them.
#
# Deliberately scoped:
#   * conclusion == 'failure' only. A 'cancelled' run means the job hit its
#     timeout-minutes cap; re-running that just burns the same time again.
#   * run_attempt < 2 makes a retry loop impossible.
#   * A genuine failure still fails on the second attempt and still alerts --
#     this buys one retry against flaky infrastructure, it does not hide bugs.

on:
  workflow_run:
    workflows:
      - "Multibagger · Discovery (weekly)"
      - "Multibagger · Weekly"
      - "Market scan · 2x per trading day"
      - "Data harvest · pre-scan enrichment (news/SEC/options/crowd/sentiment)"
      - "Daily Outcome Tracker"
      - "Data Quality Check"
      - "Universe · Weekly refresh"
      - "Weekly Rollup"
      - "Feedback Aggregator"
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the failed jobs once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Re-running failed jobs of '${{ github.event.workflow_run.name }}'" \
               "(run ${{ github.event.workflow_run.id }}, attempt ${{ github.event.workflow_run.run_attempt }})"
          gh run rerun ${{ github.event.workflow_run.id }} --failed -R ${{ github.repository }}
