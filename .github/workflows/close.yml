name: Close Pipeline

# Cron is UTC; GitHub Actions does not honor DST. We pick a single year-round
# slot tied to EST (UTC-5); during EDT (UTC-4) the run shifts one hour later in
# wall time. 21:30 UTC == 16:30 ET (EST) / 17:30 ET (EDT).
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

concurrency:
  # Don't pile up runs if a previous one is still going; queue the next.
  group: pipeline-close
  cancel-in-progress: false

env:
  RUN_TYPE: close
  TOP_N: "30"
  # pipeline/config.py reads NEXT_PUBLIC_SUPABASE_URL; secret is named SUPABASE_URL.
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
  FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
  API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  # ── Stage 1 ────────────────────────────────────────────────────────────────
  # Signal generation. Sequential per-step rather than parallel: the agents
  # share API quotas (Finnhub, FMP) and write to overlapping Supabase tables;
  # running them serial mirrors pipeline/run_full_pipeline.py exactly.
  collect:
    name: "Stage 1 · Signal Generation"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline

      - name: market_data (full universe technicals)
        run: python -m pipeline.agents.market_data

      - name: news_harvester
        run: python -m pipeline.agents.news_harvester

      - name: sec_watcher
        run: python -m pipeline.agents.sec_watcher

      - name: crowd_intelligence
        run: python -m pipeline.agents.crowd_intelligence "$RUN_TYPE"

      - name: macro_agent
        run: python -m pipeline.agents.macro_agent

      - name: options_flow
        run: python -m pipeline.agents.options_flow

  # ── Stage 2 ────────────────────────────────────────────────────────────────
  validate:
    name: "Stage 2 · Signal Validation"
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline

      - name: sentiment_scorer (processors, not agents)
        run: python -m pipeline.processors.sentiment_scorer "$RUN_TYPE"

      - name: anomaly_detector
        run: python -m pipeline.agents.anomaly_detector "$RUN_TYPE"

      - name: pattern_matcher (FAISS index from repo)
        run: python -m pipeline.agents.pattern_matcher

      - name: cross_validator
        run: python -m pipeline.agents.cross_validator "$RUN_TYPE"

  # ── Stage 3 ────────────────────────────────────────────────────────────────
  thesis:
    name: "Stage 3 · Thesis Formation"
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline

      - name: ranking_engine
        run: python -m pipeline.agents.ranking_engine "$RUN_TYPE"

      - name: catalyst_agent
        run: python -m pipeline.agents.catalyst_agent

      - name: smart_money_intel (today's row consumed by tomorrow's catalyst/debate/critic)
        run: python -m pipeline.agents.smart_money_intel "$RUN_TYPE" "$TOP_N"

      - name: debate_synthesizer (top N)
        run: python -m pipeline.agents.debate_synthesizer "$TOP_N"

      - name: critic_agent (top N)
        run: python -m pipeline.agents.critic_agent "$TOP_N"

  # ── Stage 4 ────────────────────────────────────────────────────────────────
  # Quant desk. run_desk = Monte Carlo + VaR/CVaR. run_factor_dcf = Fama-French
  # five-factor regression + DCF. run_black_litterman runs conviction_grader v1
  # internally as its step 1, so grading happens here -- risk_and_grade no
  # longer needs to call conviction_grader separately.
  quant:
    name: "Stage 4 · Quant Models"
    needs: thesis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline

      - name: Monte Carlo + VaR/CVaR
        run: python -m pipeline.quant.run_desk "$TOP_N"

      - name: GARCH desk
        run: python -m pipeline.quant.run_garch "$TOP_N"

      - name: Fama-French + DCF
        run: python -m pipeline.quant.run_factor_dcf "$TOP_N"

      - name: Black-Litterman (runs conviction_grader v1 first)
        run: python -m pipeline.quant.run_black_litterman "$RUN_TYPE"

  # ── Stage 5 ────────────────────────────────────────────────────────────────
  risk_and_grade:
    name: "Stage 5 · Risk & Conviction"
    needs: quant
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline

      - name: peer_definition
        run: python -m pipeline.agents.peer_definition "$RUN_TYPE"

      - name: peer_industry_analysis
        run: python -m pipeline.agents.peer_industry_analysis "$RUN_TYPE"

      - name: factor_overlay
        run: python -m pipeline.agents.factor_overlay "$RUN_TYPE"

      - name: portfolio_fit
        run: python -m pipeline.agents.portfolio_fit "$RUN_TYPE"

      - name: risk_flagger
        run: python -m pipeline.agents.risk_flagger "$RUN_TYPE"

      - name: position_manager (all portfolios)
        run: python -m pipeline.agents.position_manager

  # ── Stage 6 ────────────────────────────────────────────────────────────────
  # Compose, capture outcomes, trigger email. Email goes through the Next.js
  # cron route built in Step 7.3; the route flips reports.delivered_email once
  # every confirmed user lands a terminal outcome.
  deliver:
    name: "Stage 6 · Compose & Deliver"
    needs: risk_and_grade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline

      - name: Compose report
        run: |
          TODAY=$(date -u +%F)
          python -m pipeline.agents.report_composer "$TODAY" "$RUN_TYPE"

      - name: Record picks for outcome tracking
        run: |
          TODAY=$(date -u +%F)
          python -m pipeline.agents.outcome_tracker record "$TODAY" "$RUN_TYPE"

      - name: Trigger email delivery
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Curl exits non-zero on HTTP errors (-f) so a 5xx from the route
          # surfaces as a failed step. --max-time guards against hangs.
          curl -fsS -X POST --max-time 600 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/send-reports"

  # ── Failure notification ───────────────────────────────────────────────────
  notify_failure:
    name: "Notify on failure"
    needs: [collect, validate, thesis, quant, risk_and_grade, deliver]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        if: env.WEBHOOK != ''
        run: |
          curl -X POST -H "Content-Type: application/json" \
            --data "{\"text\":\":rotating_light: *${{ github.workflow }}* failed (run #${{ github.run_number }}) -- <${RUN_URL}|view logs>\"}" \
            "$WEBHOOK"
