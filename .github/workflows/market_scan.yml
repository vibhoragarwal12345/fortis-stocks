name: Market scan · 3x per trading day

# Lean rewrite PART 4. Runs the two-speed funnel three times each weekday:
# pre-market, midday, and post-close.
#
# Cron is UTC; GitHub Actions doesn't honour DST. We pick year-round UTC
# slots tied to EST (UTC-5). During EDT (UTC-4) every run shifts one
# wall-clock hour later -- acceptable for this cadence.
#
#     12:00 UTC  =  07:00 ET (EST)  / 08:00 ET (EDT)   pre-market
#     16:30 UTC  =  11:30 ET (EST)  / 12:30 ET (EDT)   midday
#     22:00 UTC  =  17:00 ET (EST)  / 18:00 ET (EDT)   post-close
#
# Budget: Layer 1 scores the full ~3,300-name universe; the slow LLM
# agents (Layer 3) + grader (Layer 4) run on the top 25 only -- sized so
# the free-LLM daily budget covers a FULL fact-checked dossier for every
# shortlisted name across all 3 daily scans now that llm.py stopped
# routing load to slow providers (June 12 2026: NVIDIA at 60-90 s/call
# carried ~45% of calls and blew the job timeout). The dossier gate hides
# any name that still lacks a dossier, so the displayed list is 20-25.
# run_scan.py enforces a soft deadline internally (SCAN_SOFT_DEADLINE_SEC,
# raised to 63 min below, owner directive June 14 2026) so the gate + finalize
# ALWAYS run; timeout-minutes (72) is the hard backstop above it. The longer
# deadline lets the critic finish more dossiers, but RAISES Actions usage --
# 3 runs/weekday now trend ABOVE the free 2,000-min/month ceiling, so a paid
# plan or trimming a daily scan is likely needed; watch the bill. The /api/scan
# manual refresh reuses this same workflow, gated to once per 2h.
#
# Layer 3 (LLM-heavy) + Layer 4 are enabled. Layer 2 stamps the
# shortlist with run_type='midday' so the unmodified deep agents pick
# it up; scan_id is the real lineage key on every table.

on:
  schedule:
    - cron: "0 12 * * 1-5"   # pre-market
    - cron: "30 16 * * 1-5"  # midday
    - cron: "0 22 * * 1-5"   # post-close
  workflow_dispatch:
    inputs:
      scan_type:
        description: "Scan label"
        required: false
        default: "manual"
        type: choice
        options:
          - premarket
          - intraday
          - postclose
          - manual
      sample:
        description: "Universe sample size (blank = full)"
        required: false
        default: ""

concurrency:
  group: market-scan
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  FINNHUB_API_KEY:             ${{ secrets.FINNHUB_API_KEY }}
  GROQ_API_KEY:                ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
  CEREBRAS_API_KEY:            ${{ secrets.CEREBRAS_API_KEY }}
  NVIDIA_API_KEY:              ${{ secrets.NVIDIA_API_KEY }}
  OPENROUTER_API_KEY:          ${{ secrets.OPENROUTER_API_KEY }}
  TIINGO_API_KEY:              ${{ secrets.TIINGO_API_KEY }}
  # Soft deadline raised 46 -> 63 min (owner directive). Must stay BELOW
  # timeout-minutes (72) so the gate + finalize always run before the hard kill.
  SCAN_SOFT_DEADLINE_SEC:      "3780"

jobs:
  scan:
    name: "Run two-speed funnel"
    runs-on: ubuntu-latest
    timeout-minutes: 72
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline

      - name: Derive scan_type from cron slot
        id: derive
        run: |
          if [ -n "${{ github.event.inputs.scan_type }}" ]; then
            echo "scan_type=${{ github.event.inputs.scan_type }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            if [ "$HOUR" = "12" ]; then echo "scan_type=premarket" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "22" ]; then echo "scan_type=postclose" >> $GITHUB_OUTPUT
            else echo "scan_type=intraday" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run scan (layers 1-4)
        run: |
          SAMPLE_ARG=""
          if [ -n "${{ github.event.inputs.sample }}" ]; then
            SAMPLE_ARG="--sample ${{ github.event.inputs.sample }}"
          fi
          python -m pipeline.scan.run_scan \
            --scan-type ${{ steps.derive.outputs.scan_type }} \
            --top-n 25 \
            $SAMPLE_ARG
