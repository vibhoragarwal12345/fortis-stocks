name: Market scan · 2x per trading day

# Lean rewrite PART 4. Runs the two-speed funnel twice each weekday:
# pre-market and midday. (Post-close was dropped June 14 2026 -- markets are
# closed overnight so its picks just duplicate the next premarket run; cutting
# it frees Actions minutes for the longer/bigger premarket + midday scans.)
#
# Cron is UTC; GitHub Actions doesn't honour DST. We pick year-round UTC
# slots tied to EST (UTC-5). During EDT (UTC-4) every run shifts one
# wall-clock hour later -- acceptable for this cadence.
#
#     12:00 UTC  =  07:00 ET (EST)  / 08:00 ET (EDT)   pre-market
#     16:30 UTC  =  11:30 ET (EST)  / 12:30 ET (EDT)   midday
#
# Budget: Layer 1 scores the full ~3,300-name universe; the slow LLM
# agents (Layer 3) + grader (Layer 4) run on the top 35 -- sized so that
# after the dossier gate trims names whose critique/bear fail factcheck
# (~30-35% on a strict bar), 20-25 fully-verified dossiers still DISPLAY.
# Layer 3 generates dossiers CONCURRENTLY (DOSSIER_CONCURRENCY) so 35 names
# fit the window. The free-LLM daily budget covers this across 2 daily scans
# now that llm.py stopped
# routing load to slow providers (June 12 2026: NVIDIA at 60-90 s/call
# carried ~45% of calls and blew the job timeout). The dossier gate hides
# any name that still lacks a dossier, so the displayed list is 20-25.
# run_scan.py enforces a soft deadline internally (SCAN_SOFT_DEADLINE_SEC,
# raised to 63 min below, owner directive June 14 2026) so the gate + finalize
# ALWAYS run; timeout-minutes (72) is the hard backstop above it. The longer
# deadline lets the critic finish more dossiers. Parallel Layer-3 cuts each
# scan's wall-time, and post-close is gone, so 2 runs/weekday should fit closer
# to the free 2,000-min/month ceiling -- but VALIDATE actual minutes over the
# first week; a paid plan is the lever if it tips over. The /api/scan manual
# refresh reuses this same workflow, gated to once per 2h.
#
# Layer 3 (LLM-heavy) + Layer 4 are enabled. Layer 2 stamps the
# shortlist with run_type='midday' so the unmodified deep agents pick
# it up; scan_id is the real lineage key on every table.

on:
  # Scheduled trigger: Supabase pg_cron fires a repository_dispatch at exactly
  # 12:00 + 16:30 UTC Mon-Fri (migration 053). GitHub's native `schedule:` cron
  # was REMOVED (June 2026): it lagged 15-60 min / dropped ticks, AND it double-
  # fired alongside pg_cron -- two scans per slot drained the shared LLM budget.
  # pg_cron is now the single scheduled source; workflow_dispatch stays for
  # manual runs. client_payload.scan_type sets the label.
  repository_dispatch:
    types: [run-market-scan]
  workflow_dispatch:
    inputs:
      scan_type:
        description: "Scan label"
        required: false
        default: "manual"
        type: choice
        options:
          - premarket
          - intraday
          - postclose
          - manual
      sample:
        description: "Universe sample size (blank = full)"
        required: false
        default: ""

concurrency:
  group: market-scan
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL:    ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY:   ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  FINNHUB_API_KEY:             ${{ secrets.FINNHUB_API_KEY }}
  GROQ_API_KEY:                ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
  CEREBRAS_API_KEY:            ${{ secrets.CEREBRAS_API_KEY }}
  CEREBRAS_API_KEY_2:          ${{ secrets.CEREBRAS_API_KEY_2 }}
  MISTRAL_API_KEY:           ${{ secrets.MISTRAL_API_KEY }}
  SAMBANOVA_API_KEY:         ${{ secrets.SAMBANOVA_API_KEY }}
  GROQ_API_KEY_2:              ${{ secrets.GROQ_API_KEY_2 }}
  NVIDIA_API_KEY:              ${{ secrets.NVIDIA_API_KEY }}
  OPENROUTER_API_KEY:          ${{ secrets.OPENROUTER_API_KEY }}
  TIINGO_API_KEY:              ${{ secrets.TIINGO_API_KEY }}
  # Soft deadline raised 46 -> 63 min (owner directive). Must stay BELOW
  # timeout-minutes (72) so the gate + finalize always run before the hard kill.
  SCAN_SOFT_DEADLINE_SEC:      "3780"
  # Layer-3 dossier concurrency. Lowered 5 -> 3 (June 2026): with the gateway
  # now sharding tier-0 load across both Cerebras accounts (llm.py), 3 steady
  # threads clear the top names without the per-minute 429 storms that 5
  # threads caused -- the critic reaches enough names to field a SHARP 15.
  DOSSIER_CONCURRENCY:         "3"

jobs:
  scan:
    name: "Run two-speed funnel"
    runs-on: ubuntu-latest
    timeout-minutes: 72
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline

      - name: Derive scan_type from cron slot
        id: derive
        run: |
          if [ -n "${{ github.event.client_payload.scan_type }}" ]; then
            echo "scan_type=${{ github.event.client_payload.scan_type }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.scan_type }}" ]; then
            echo "scan_type=${{ github.event.inputs.scan_type }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            if [ "$HOUR" = "12" ]; then echo "scan_type=premarket" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "22" ]; then echo "scan_type=postclose" >> $GITHUB_OUTPUT
            else echo "scan_type=intraday" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run scan (layers 1-4)
        run: |
          SAMPLE_ARG=""
          if [ -n "${{ github.event.inputs.sample }}" ]; then
            SAMPLE_ARG="--sample ${{ github.event.inputs.sample }}"
          fi
          python -m pipeline.scan.run_scan \
            --scan-type ${{ steps.derive.outputs.scan_type }} \
            --top-n 35 \
            $SAMPLE_ARG
